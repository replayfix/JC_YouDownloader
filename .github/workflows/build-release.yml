name: Publicar portable Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión nueva (vacío: incrementar el último parche)"
        required: false
        type: string

permissions:
  contents: write
concurrency:
  group: portable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Instalar dependencias
        run: npm ci --ignore-scripts
      - name: Preparar versión
        id: release
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
        run: node scripts/prepare-release.mjs
      - name: Comprobar interfaz y pruebas JavaScript
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/*.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Obtener herramientas incluidas
        run: node scripts/fetch-binaries.mjs
      - name: Comprobar formato y pruebas Rust
        working-directory: src-tauri
        run: |
          cargo fmt -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compilar portable
        run: npm run build:portable
      - name: Comprimir portable
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $archive = "release-assets/JC_YouDownloader_$env:RELEASE_VERSION`_portable.zip"
          Get-ChildItem -LiteralPath portable -Force | Compress-Archive -DestinationPath $archive -CompressionLevel Optimal
      - name: Firmar ZIP
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if (!$env:TAURI_SIGNING_PRIVATE_KEY -or !$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) { throw "Faltan los secretos de firma" }
          node node_modules/@tauri-apps/cli/tauri.js signer sign --app-version $env:RELEASE_VERSION "release-assets/JC_YouDownloader_$env:RELEASE_VERSION`_portable.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generar latest.json
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/create-update-manifest.mjs $env:RELEASE_VERSION "release-assets/JC_YouDownloader_$env:RELEASE_VERSION`_portable.zip" release-assets/latest.json
      - name: Publicar versión estable
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: YouDownloader ${{ steps.release.outputs.version }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.zip
            release-assets/*.zip.sig
            release-assets/latest.json
